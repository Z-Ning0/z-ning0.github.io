name: Deploy static site to Pages

# 将 main 的 site/ 直接发布到 GitHub Pages。

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: ./site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Upload did not return an artifact ID'
            exit 1
          fi
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          filter='[.artifacts[] | select(.name == "github-pages" and .expired == false)]'
          filter+=" | length == 1 and .[0].id == $EXPECTED_ARTIFACT_ID and .[0].size_in_bytes > 0"
          for attempt in {1..12}; do
            if visible=$(gh api "$endpoint" --jq "$filter") && [[ "$visible" == true ]]; then
              printf 'Pages artifact %s is visible in Actions (attempt %s)\n' "$EXPECTED_ARTIFACT_ID" "$attempt"
              exit 0
            fi
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo '::error::Expected github-pages artifact was not visible to Actions before the deadline'
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
